<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel — Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #181b21; color: #c9d1d9; font-family: 'Inter','Segoe UI',system-ui,sans-serif; min-height: 100vh; }

    @keyframes ping {
      0%        { transform: scale(1); opacity: 0.6; }
      75%, 100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* Nav */
    #nav {
      background: #14161c; border-bottom: 1px solid #2a2f38;
      padding: 0 28px; height: 54px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .nav-left  { display: flex; align-items: center; gap: 14px; }
    .nav-logo  { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-logo-text { font-weight: 700; font-size: 15px; color: #e6edf3; }
    .nav-div  { width: 1px; height: 16px; background: #2a2f38; }
    .nav-page { font-size: 13px; color: #3d4450; }
    .nav-right { display: flex; gap: 8px; align-items: center; }
    .nav-email { font-size: 12px; color: #4d5562; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-time  { font-size: 12px; color: #3d4450; }
    .btn-nav {
      background: #1e2228; border: 1px solid #2a2f38; color: #6e7681;
      padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: inherit; transition: border-color 0.15s;
    }
    .btn-nav:hover { border-color: #4a9eff; }
    .btn-add {
      background: #4a9eff; border: none; color: #fff;
      padding: 5px 14px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: 600; font-family: inherit;
    }
    .btn-add.cancel {
      background: #1e2228; border: 1px solid #2a2f38; color: #6e7681;
    }
    .btn-signout {
      background: transparent; border: 1px solid #2a2f38; color: #4d5562;
      padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit;
    }

    /* Main */
    #main { max-width: 960px; margin: 0 auto; padding: 24px; }

    /* Alerts */
    .alert-error {
      background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #f87171; font-size: 13px;
    }

    /* Incidents */
    #incidents-box {
      background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.22);
      border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
    }
    .inc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .inc-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: pulse 1.5s ease infinite; }
    .inc-label { font-size: 11px; font-weight: 700; color: #f87171; text-transform: uppercase; letter-spacing: 0.08em; }
    .inc-row { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid rgba(239,68,68,0.15); font-size: 13px; }
    .inc-name { color: #fca5a5; font-weight: 500; }
    .inc-time { color: #4d5562; }

    /* Add form */
    #form-box {
      background: #1e2228; border: 1px solid #2a2f38; border-radius: 10px;
      padding: 16px 18px; margin-bottom: 16px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 10px; color: #3d4450; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.08em; }
    .form-input {
      background: #14161c; border: 1px solid #2a2f38; border-radius: 6px;
      color: #e6edf3; padding: 8px 11px; font-size: 13px; outline: none;
      font-family: inherit; transition: border-color 0.15s;
    }
    .form-input:focus { border-color: #4a9eff; }
    .btn-add-mon {
      background: #4a9eff; border: none; color: #fff; padding: 9px 20px;
      border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
    }
    .btn-add-mon:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Stat cards */
    #stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-card { background: #1e2228; border: 1px solid #2a2f38; border-radius: 10px; padding: 16px 18px; }
    .stat-label { font-size: 10px; color: #3d4450; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 700; color: #e6edf3; }

    /* Monitor table header */
    .mon-head {
      display: grid;
      grid-template-columns: 20px 1fr 132px 100px 90px 60px auto;
      align-items: center; gap: 0 14px; padding: 6px 16px; margin-bottom: 4px;
    }
    .mon-head span { font-size: 10px; color: #3d4450; text-transform: uppercase; letter-spacing: 0.08em; }
    .right { text-align: right; }

    /* Monitor rows */
    .mon-rows { display: flex; flex-direction: column; gap: 6px; }
    .mon-row {
      background: #1e2228; border: 1px solid #2a2f38; border-radius: 9px;
      padding: 13px 16px; display: grid;
      grid-template-columns: 20px 1fr 132px 100px 90px 60px auto;
      align-items: center; gap: 0 14px;
    }
    .mon-row.down { border-color: rgba(239,68,68,0.3); }
    .dot-wrap { position: relative; width: 9px; height: 9px; }
    .dot-ping { position: absolute; inset: 0; border-radius: 50%; background: #22c55e; animation: ping 2.5s ease-out infinite; }
    .dot { position: relative; width: 9px; height: 9px; border-radius: 50%; }
    .dot.up   { background: #22c55e; }
    .dot.down { background: #ef4444; }
    .dot.unknown { background: #2a2f38; }
    .mon-name { font-weight: 600; font-size: 14px; color: #e6edf3; margin-bottom: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mon-url  { font-size: 11px; color: #3d4450; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-pill {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-pill.up      { background: rgba(34,197,94,0.1);   color: #22c55e; border: 1px solid rgba(34,197,94,0.25); }
    .status-pill.down    { background: rgba(239,68,68,0.1);   color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
    .status-pill.unknown { background: rgba(74,85,98,0.2);    color: #4d5562; border: 1px solid #2a2f38; }
    .delete-btns { display: flex; gap: 4px; }
    .btn-del {
      background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
      color: #f87171; padding: 3px 8px; border-radius: 5px; cursor: pointer;
      font-size: 11px; font-weight: 600; white-space: nowrap; font-family: inherit;
    }
    .btn-del-no {
      background: transparent; border: 1px solid #2a2f38; color: #4d5562;
      padding: 3px 7px; border-radius: 5px; cursor: pointer; font-size: 11px; font-family: inherit;
    }
    .btn-del-x {
      background: transparent; border: 1px solid #2a2f38; color: #3d4450;
      width: 28px; height: 28px; border-radius: 5px; cursor: pointer; font-size: 12px;
      display: flex; align-items: center; justify-content: center; font-family: inherit;
    }

    /* Mobile cards */
    .mon-cards { display: none; flex-direction: column; gap: 8px; }
    .mon-card {
      background: #1e2228; border: 1px solid #2a2f38; border-radius: 10px; padding: 14px 16px;
    }
    .mon-card.down { border-color: rgba(239,68,68,0.3); }
    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .card-left { display: flex; align-items: center; gap: 10px; }
    .card-stats { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #2a2f38; }
    .card-stat-label { font-size: 10px; color: #3d4450; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }

    /* Empty state */
    .empty {
      background: #1e2228; border: 1px dashed #2a2f38; border-radius: 10px;
      padding: 56px 24px; text-align: center; color: #3d4450; font-size: 14px;
    }

    /* Summary bar */
    #summary {
      margin-top: 10px; padding: 10px 16px; background: #14161c;
      border: 1px solid #2a2f38; border-radius: 8px;
      display: flex; justify-content: space-between;
    }
    #summary span { font-size: 12px; color: #3d4450; }

    /* Responsive */
    @media (max-width: 640px) {
      #stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .mon-head, .mon-rows { display: none !important; }
      .mon-cards { display: flex !important; }
      .nav-email, .nav-time { display: none; }
      .nav-right { gap: 6px; }
      #main { padding: 16px; }
      #nav { padding: 0 16px; }
    }
  </style>
</head>
<body>

<nav id="nav">
  <div class="nav-left">
    <a href="/" class="nav-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 6v6c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V6L12 2z"
          stroke="#4a9eff" stroke-width="1.5" stroke-linejoin="round" fill="rgba(74,158,255,0.08)"/>
        <path d="M9 12l2 2 4-4" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nav-logo-text">Sentinel</span>
    </a>
    <div class="nav-div"></div>
    <span class="nav-page">Dashboard</span>
  </div>
  <div class="nav-right">
    <span class="nav-email" id="nav-email"></span>
    <span class="nav-time"  id="nav-time"></span>
    <button class="btn-nav" onclick="doRefresh()">↻</button>
    <button class="btn-add" id="add-btn" onclick="toggleForm()">+ Monitor</button>
    <button class="btn-signout" onclick="doSignOut()">Sign out</button>
  </div>
</nav>

<main id="main">
  <div id="error-box"    class="alert-error" style="display:none"></div>
  <div id="incidents-box" style="display:none">
    <div class="inc-header">
      <div class="inc-dot"></div>
      <span class="inc-label" id="inc-label"></span>
    </div>
    <div id="inc-rows"></div>
  </div>
  <div id="form-box" style="display:none">
    <div class="form-group" style="flex:1 1 130px">
      <label>Name</label>
      <input type="text" id="f-name" placeholder="My API" class="form-input">
    </div>
    <div class="form-group" style="flex:2 1 200px">
      <label>URL</label>
      <input type="text" id="f-url" placeholder="https://example.com" class="form-input" id="f-url">
    </div>
    <button class="btn-add-mon" id="add-mon-btn" onclick="doAddMonitor()">Add</button>
  </div>

  <div id="stat-grid">
    <div class="stat-card"><div class="stat-label">Total</div>       <div class="stat-value" id="s-total">—</div></div>
    <div class="stat-card"><div class="stat-label">Online</div>      <div class="stat-value" id="s-online">—</div></div>
    <div class="stat-card"><div class="stat-label">Down</div>        <div class="stat-value" id="s-down">—</div></div>
    <div class="stat-card"><div class="stat-label">Avg response</div><div class="stat-value" id="s-avg">—</div></div>
  </div>

  <div id="mon-list">
    <div class="empty">Loading…</div>
  </div>

  <div id="summary" style="display:none">
    <span id="sum-left"></span>
    <span id="sum-right"></span>
  </div>
</main>

<script>
  const API    = 'https://jx2iutyr3k.execute-api.af-south-1.amazonaws.com/prod';
  const POOL_ID    = 'af-south-1_jQVVRsIdS';
  const CLIENT_ID  = '8tltntn8rqfe7gkdn794g6a7c';

  const pool = new AmazonCognitoIdentity.CognitoUserPool({ UserPoolId: POOL_ID, ClientId: CLIENT_ID });

  let monitors     = [];
  let analytics    = {};
  let incidents    = [];
  let userEmail    = null;
  let lastRefresh  = null;
  let formOpen     = false;
  let confirmDel   = null;
  let refreshTimer = null;

  // ── Auth ──────────────────────────────────────────────────────────────────
  function getSession() {
    return new Promise(res => {
      const u = pool.getCurrentUser();
      if (!u) return res(null);
      u.getSession((err, s) => res(err || !s || !s.isValid() ? null : s));
    });
  }
  async function getToken() {
    const s = await getSession();
    return s ? s.getIdToken().getJwtToken() : null;
  }
  async function authFetch(url, opts = {}) {
    const tok = await getToken();
    if (!tok) { go('/auth'); return; }
    return fetch(url, {
      ...opts,
      headers: { 'Content-Type':'application/json', ...opts.headers, Authorization:'Bearer '+tok },
    });
  }
  function doSignOut() {
    const u = pool.getCurrentUser();
    if (u) u.signOut();
    go('/auth');
  }
  function go(path) { window.location.replace(path); }

  // ── Init ──────────────────────────────────────────────────────────────────
  (async function init() {
    const session = await getSession();
    if (!session) return go('/auth');
    const payload = session.getIdToken().decodePayload();
    userEmail = payload.email || null;
    if (userEmail) document.getElementById('nav-email').textContent = userEmail;
    await fetchAll();
    refreshTimer = setInterval(fetchAll, 30000);
  })();

  // ── Data fetching ─────────────────────────────────────────────────────────
  async function fetchAll() {
    try {
      const [monRes, incRes] = await Promise.all([
        authFetch(API + '/monitors'),
        authFetch(API + '/incidents'),
      ]);
      if (!monRes) return;
      if (monRes.status === 401 || monRes.status === 403) { doSignOut(); return; }
      if (!monRes.ok) throw new Error('API unreachable');

      const mons = await monRes.json();
      const incs = incRes && incRes.ok ? await incRes.json() : [];

      const aMap = {};
      await Promise.all(mons.map(async m => {
        try {
          const r = await authFetch(API + '/monitors/' + m.id + '/analytics');
          if (r && r.ok) aMap[m.id] = await r.json();
        } catch {}
      }));

      monitors  = mons;
      analytics = aMap;
      incidents = incs;
      lastRefresh = new Date();
      renderAll();
      setError(null);
    } catch (e) {
      setError(e.message || 'Could not reach API');
    }
  }

  function doRefresh() { fetchAll(); }

  // ── Render ────────────────────────────────────────────────────────────────
  function renderAll() {
    renderTime();
    renderStats();
    renderIncidents();
    renderMonitors();
  }

  function renderTime() {
    if (!lastRefresh) return;
    const d = Math.floor((Date.now() - lastRefresh.getTime()) / 1000);
    let t;
    if (d < 60) t = d + 's ago';
    else if (d < 3600) t = Math.floor(d/60) + 'm ago';
    else t = Math.floor(d/3600) + 'h ago';
    document.getElementById('nav-time').textContent = t;
  }

  function renderStats() {
    const upCount   = monitors.filter(m => m.lastStatus === 'up').length;
    const downCount = monitors.filter(m => m.lastStatus === 'down').length;
    const respondingMonitors = monitors.filter(m => m.lastResponseTime);
    const avgMs = respondingMonitors.length > 0
      ? Math.round(respondingMonitors.reduce((s,m) => s + m.lastResponseTime, 0) / respondingMonitors.length)
      : null;

    document.getElementById('s-total').textContent  = monitors.length;
    const onlineEl = document.getElementById('s-online');
    onlineEl.textContent = upCount;
    onlineEl.style.color = upCount > 0 ? '#22c55e' : '#e6edf3';
    const downEl = document.getElementById('s-down');
    downEl.textContent = downCount;
    downEl.style.color = downCount > 0 ? '#ef4444' : '#e6edf3';
    document.getElementById('s-avg').textContent = avgMs ? avgMs + 'ms' : '—';
  }

  function renderIncidents() {
    const active = incidents.filter(inc => monitors.some(m => m.id === inc.monitorId));
    const box = document.getElementById('incidents-box');
    if (active.length === 0) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    document.getElementById('inc-label').textContent =
      active.length + ' active incident' + (active.length > 1 ? 's' : '');
    document.getElementById('inc-rows').innerHTML = active.map(inc => {
      const mon = monitors.find(m => m.id === inc.monitorId);
      return `<div class="inc-row">
        <span class="inc-name">${esc(mon ? mon.name : inc.url)}</span>
        <span class="inc-time">since ${timeAgo(inc.startTime)}</span>
      </div>`;
    }).join('');
  }

  function renderMonitors() {
    const list = document.getElementById('mon-list');
    if (monitors.length === 0) {
      list.innerHTML = '<div class="empty">No monitors yet — add one to get started.</div>';
      document.getElementById('summary').style.display = 'none';
      return;
    }

    const uptime = monitors.length > 0
      ? (monitors.reduce((s,m) => s + (analytics[m.id] ? parseFloat(analytics[m.id].uptime) : 100), 0) / monitors.length).toFixed(1)
      : null;

    list.innerHTML = `
      <!-- Desktop table -->
      <div class="mon-head">
        <span></span>
        <span>Monitor</span>
        <span class="right">Uptime (24h)</span>
        <span class="right">Response</span>
        <span class="right">Status</span>
        <span class="right">Checked</span>
        <span></span>
      </div>
      <div class="mon-rows">
        ${monitors.map(m => monRow(m)).join('')}
      </div>
      <!-- Mobile cards -->
      <div class="mon-cards">
        ${monitors.map(m => monCard(m)).join('')}
      </div>
    `;

    // Summary
    if (uptime) {
      const sum = document.getElementById('summary');
      sum.style.display = 'flex';
      document.getElementById('sum-left').textContent =
        monitors.length + ' monitor' + (monitors.length !== 1 ? 's' : '') + ' · checks every 60s';
      document.getElementById('sum-right').innerHTML =
        'avg uptime <span style="color:#22c55e;font-weight:600">' + uptime + '%</span>';
    }
  }

  function monRow(m) {
    const a    = analytics[m.id];
    const isUp   = m.lastStatus === 'up';
    const isDown = m.lastStatus === 'down';
    const msColor = !m.lastResponseTime ? '#4d5562'
      : m.lastResponseTime < 500  ? '#22c55e'
      : m.lastResponseTime < 2000 ? '#f59e0b' : '#ef4444';
    const delBtn = confirmDel === m.id
      ? `<div class="delete-btns">
           <button class="btn-del" onclick="doDelete('${m.id}')">Remove</button>
           <button class="btn-del-no" onclick="cancelDel()">No</button>
         </div>`
      : `<button class="btn-del-x" onclick="askDel('${m.id}')">✕</button>`;

    return `<div class="mon-row ${isDown ? 'down' : ''}">
      <div class="dot-wrap">
        ${isUp ? '<div class="dot-ping"></div>' : ''}
        <div class="dot ${m.lastStatus}"></div>
      </div>
      <div style="overflow:hidden">
        <div class="mon-name">${esc(m.name)}</div>
        <div class="mon-url">${esc(m.url)}</div>
      </div>
      <div class="right">
        ${a ? uptimeBar(a.uptime) : '<span style="font-size:12px;color:#3d4450">—</span>'}
      </div>
      <div class="right">
        <span style="font-size:14px;font-weight:600;color:${msColor}">
          ${m.lastResponseTime !== null ? m.lastResponseTime + 'ms' : '—'}
        </span>
      </div>
      <div class="right">
        <span class="status-pill ${m.lastStatus}">${m.lastStatus}</span>
      </div>
      <div class="right" style="font-size:11px;color:#3d4450">${timeAgo(m.lastChecked)}</div>
      ${delBtn}
    </div>`;
  }

  function monCard(m) {
    const a    = analytics[m.id];
    const isUp   = m.lastStatus === 'up';
    const isDown = m.lastStatus === 'down';
    const msColor = !m.lastResponseTime ? '#4d5562'
      : m.lastResponseTime < 500  ? '#22c55e'
      : m.lastResponseTime < 2000 ? '#f59e0b' : '#ef4444';
    const delBtn = confirmDel === m.id
      ? `<div class="delete-btns">
           <button class="btn-del" onclick="doDelete('${m.id}')">Remove</button>
           <button class="btn-del-no" onclick="cancelDel()">No</button>
         </div>`
      : `<button class="btn-del-x" onclick="askDel('${m.id}')">✕</button>`;
    return `<div class="mon-card ${isDown ? 'down' : ''}">
      <div class="card-top">
        <div class="card-left">
          <div class="dot-wrap">
            ${isUp ? '<div class="dot-ping"></div>' : ''}
            <div class="dot ${m.lastStatus}"></div>
          </div>
          <div>
            <div class="mon-name">${esc(m.name)}</div>
            <div class="mon-url">${esc(m.url)}</div>
          </div>
        </div>
        ${delBtn}
      </div>
      <div class="card-stats">
        <div>
          <div class="card-stat-label">Uptime</div>
          ${a ? uptimeBar(a.uptime) : '<span style="font-size:12px;color:#3d4450">—</span>'}
        </div>
        <div style="text-align:right">
          <div class="card-stat-label">Response</div>
          <span style="font-size:13px;font-weight:600;color:${msColor}">
            ${m.lastResponseTime !== null ? m.lastResponseTime + 'ms' : '—'}
          </span>
        </div>
        <div style="text-align:right">
          <div class="card-stat-label">Checked</div>
          <span style="font-size:12px;color:#4d5562">${timeAgo(m.lastChecked)}</span>
        </div>
      </div>
    </div>`;
  }

  // ── Monitor CRUD ──────────────────────────────────────────────────────────
  function toggleForm() {
    formOpen = !formOpen;
    document.getElementById('form-box').style.display = formOpen ? 'flex' : 'none';
    const btn = document.getElementById('add-btn');
    btn.textContent = formOpen ? 'Cancel' : '+ Monitor';
    btn.className   = formOpen ? 'btn-add cancel' : 'btn-add';
  }

  async function doAddMonitor() {
    const name = document.getElementById('f-name').value.trim();
    const raw  = document.getElementById('f-url').value.trim();
    if (!name || !raw) return;
    const url  = raw.startsWith('http') ? raw : 'https://' + raw;
    const btn  = document.getElementById('add-mon-btn');
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      await authFetch(API + '/monitors', { method:'POST', body:JSON.stringify({ name, url }) });
      document.getElementById('f-name').value = '';
      document.getElementById('f-url').value  = '';
      toggleForm();
      await fetchAll();
    } catch { alert('Failed to add monitor.'); }
    finally { btn.disabled = false; btn.textContent = 'Add'; }
  }

  function askDel(id)    { confirmDel = id; renderMonitors(); }
  function cancelDel()   { confirmDel = null; renderMonitors(); }
  async function doDelete(id) {
    await authFetch(API + '/monitors/' + id, { method:'DELETE' });
    confirmDel = null;
    await fetchAll();
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function uptimeBar(uptime) {
    const pct = parseFloat(uptime);
    const color = pct >= 99 ? '#16a34a' : pct >= 95 ? '#d97706' : '#dc2626';
    return `<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
      <div style="width:72px;height:3px;background:#2a2f38;border-radius:2px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:2px"></div>
      </div>
      <span style="font-size:12px;font-weight:600;color:${color};min-width:40px;text-align:right">${uptime}%</span>
    </div>`;
  }

  function timeAgo(iso) {
    if (!iso) return 'never';
    const d = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (d < 60) return d + 's ago';
    if (d < 3600) return Math.floor(d/60) + 'm ago';
    if (d < 86400) return Math.floor(d/3600) + 'h ago';
    return Math.floor(d/86400) + 'd ago';
  }

  function setError(msg) {
    const el = document.getElementById('error-box');
    el.style.display = msg ? 'block' : 'none';
    el.textContent   = msg || '';
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Form keyboard ─────────────────────────────────────────────────────────
  document.getElementById('f-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') doAddMonitor();
  });

  // ── Refresh display time every 10s ────────────────────────────────────────
  setInterval(renderTime, 10000);
</script>
</body>
</html>
